name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run build

      - name: Create plugin zip
        run: |
          # Inner folder must not be named "goodblocks". Sites still run the
          # old after_install, which deletes plugins/goodblocks when the zip
          # already unpacked there. A unique folder makes that hook move
          # instead of wiping. Do not upload extra *-folder.zip assets.
          mkdir -p dist/goodblocks-package
          cp -R goodblocks.php inc build dist/goodblocks-package/
          cd dist
          zip -r goodblocks.zip \
            goodblocks-package/ \
            -x "*.DS_Store"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/goodblocks.zip
          generate_release_notes: true
